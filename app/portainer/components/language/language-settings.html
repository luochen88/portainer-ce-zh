<div class="mt-6">
  <rd-widget>
    <rd-widget-header icon="languages" title-text="{{ 'account.language.title' | i18n }}"></rd-widget-header>
    <rd-widget-body>
      <form class="form-horizontal">
        <div class="form-group">
          <label for="language-selector" class="col-sm-3 col-lg-2 control-label text-left">{{ 'account.language.field.label' | i18n }}</label>
          <div class="col-sm-9 col-lg-10">
            <select
              id="language-selector"
              class="form-control"
              ng-model="$ctrl.state.language"
              ng-options="language.id as language.label for language in $ctrl.state.availableLanguages"
              ng-change="$ctrl.setLanguage($ctrl.state.language)"
            ></select>
            <p class="small text-muted mt-2">{{ 'account.language.field.description' | i18n }}</p>
          </div>
        </div>
      </form>
    </rd-widget-body>
  </rd-widget>
</div>
